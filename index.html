<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collector's Fix · Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: shop counter at night — neon sign header, tab rail, drawers and ledgers below */
:root{
  --bg:#141113; --panel:#1e191b; --panel2:#251f21; --line:#3a2f2c; --fg:#ece3d6; --muted:#a3968a;
  --neon:#f3d33b; --teal:#36d6c3; --rust:#c2643a; --bad:#ff6b6b; --good:#4ade80;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);min-height:100vh;
  background-image:radial-gradient(1200px 400px at 80% -10%,rgba(243,211,59,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(194,100,58,.10),transparent 60%)}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font:800 clamp(32px,6vw,52px)/.9 var(--f-display);letter-spacing:.02em;margin:0;text-transform:uppercase;color:var(--neon);text-shadow:0 0 18px rgba(243,211,59,.35)}
h1 small{display:block;font-size:.36em;color:var(--teal);letter-spacing:.24em;text-shadow:0 0 12px rgba(54,214,195,.4);margin-bottom:6px}
h2{margin:0;font:800 22px var(--f-display);text-transform:uppercase;letter-spacing:.06em}
h3{font:800 18px var(--f-display);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
.who{font:12px var(--f-mono);color:var(--muted);text-align:right;display:grid;gap:4px;justify-items:end}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{font:600 13px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
nav a:hover{color:var(--fg)}
nav a[aria-current=page]{color:#1a1405;background:var(--neon);border-color:var(--neon)}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#1a0808;font-size:11px;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.pad{padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
label{display:grid;gap:4px;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
input,select,button{font:inherit;color:var(--fg);background:#120f10;border:1px solid var(--line);border-radius:3px;padding:9px 11px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button{cursor:pointer;font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.go{background:var(--neon);color:#1a1405;border-color:var(--neon);text-transform:uppercase;letter-spacing:.08em;padding-inline:16px}
.ghost{background:transparent}
.ghost:hover{border-color:var(--muted)}
.ok{background:var(--good);border-color:var(--good);color:#06210f}
.small{padding:5px 9px;font-size:13px}
.status{font:13px var(--f-mono);color:var(--muted);min-height:1.5em}
.status.err{color:var(--bad)} .status.okc{color:var(--teal)}
.drawers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.drawer{padding:16px 18px;display:grid;gap:4px;position:relative;overflow:hidden}
.drawer::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.drawer h2{color:var(--c);font-size:19px}
.big{font:600 clamp(24px,4vw,34px)/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.drawer .big{font-size:clamp(22px,2.6vw,32px);overflow-wrap:anywhere}
.sub{font:13px var(--f-mono);color:var(--muted)}
.neg{color:var(--bad)} .pos{color:var(--teal)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.t{font-family:var(--f-mono)}
.pill{font:600 11px var(--f-mono);padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.06em}
.pill.bazaar_sale{background:rgba(243,211,59,.15);color:var(--neon)}
.pill.im_sale{background:rgba(54,214,195,.15);color:var(--teal)}
.pill.mug{background:rgba(255,107,107,.15);color:var(--bad)}
.pill.receive{background:rgba(194,100,58,.2);color:#e8956d}
.empty{color:var(--muted);padding:14px 10px;font-style:italic}
.alerts{display:grid;gap:8px}
.alert{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:4px;border:1px solid}
.alert.pending{border-color:rgba(255,107,107,.55);background:rgba(255,107,107,.08)}
.alert.paid{border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.07)}
.alert .msg{min-width:0;flex:1 1 320px}
.alert .msg b{font-family:var(--f-mono)}
.alert.pending .amt{color:var(--bad)} .alert.paid .amt{color:var(--good)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.pending .dot{background:var(--bad);box-shadow:0 0 8px var(--bad)} .paid .dot{background:var(--good)}
.bar{height:8px;background:#120f10;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.progress{display:grid;gap:6px}
.bar.big-bar{height:14px;border-radius:7px}
.bar i{transition:width .6s ease}
.bar.warn i{background:var(--neon)} .bar.full i{background:var(--good)}
.card{padding:16px;display:grid;gap:12px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{display:grid;gap:2px}
.kv span{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kv b{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums}
.calc{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:8px}
.calc .out{font:13px var(--f-mono);color:var(--muted)}
.calc .out b{color:var(--fg)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:75ch;margin:0}
.login{max-width:420px;margin:8vh auto 0;padding:24px;display:grid;gap:14px}
.login h1{font-size:44px}
.inactive{opacity:.55}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{white-space:pre-wrap;word-break:break-all;font:12px var(--f-mono);background:#0e0c0d;padding:10px;border:1px solid var(--line);max-height:300px;overflow:auto}
.rentbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.stocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.stocks>div{display:grid;gap:6px;align-content:start;min-width:0}
.stocks .acct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;align-self:end}
.segbtn{display:flex;align-items:center;gap:6px;padding:9px 12px;cursor:pointer;text-transform:none;letter-spacing:0;font:600 13px var(--f-body);color:var(--muted)}
.segbtn input{position:absolute;opacity:0;pointer-events:none}
.segbtn.in:has(input:checked){background:rgba(74,222,128,.15);color:var(--good)}
.segbtn.out:has(input:checked){background:rgba(255,107,107,.15);color:var(--bad)}
.segbtn:has(input:focus-visible){outline:2px solid var(--teal);outline-offset:-2px}
.statement{overflow:hidden}
.sday{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sline{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto 34px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.sline:last-child{border-bottom:0}
.sline .arrow{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.sline.in .arrow{background:rgba(74,222,128,.15);color:var(--good)}
.sline.out .arrow{background:rgba(255,107,107,.15);color:var(--bad)}
.sline.internal{opacity:.55}
.swhat{display:grid;gap:2px;min-width:0}
.swhat b{font-weight:600;overflow-wrap:anywhere}
.tag{font:600 11px var(--f-mono);padding:3px 8px;border-radius:2px;background:#120f10;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.samt{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sline.in .samt{color:var(--good)} .sline.out .samt{color:var(--bad)}
button.danger{border-color:var(--bad);color:var(--bad)}
@media (max-width:640px){.sline{grid-template-columns:28px minmax(0,1fr) auto;row-gap:4px}.sline .tag{grid-column:2;justify-self:start}.sline .samt{grid-column:3;grid-row:1}.sline button,.sline .spacer{grid-column:3;grid-row:2;justify-self:end}}
.lotedit{border-top:1px dashed var(--line);padding-top:10px}
.lotedit summary{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--teal)}
.rlist{display:grid;gap:4px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;padding:6px 8px;background:#120f10;border:1px solid var(--line);border-radius:3px}
.rrow .t{font:12px var(--f-mono);color:var(--muted)}
.rrow.off{opacity:.6}
.rrow.off span{text-decoration:line-through}
.alert .pick{display:flex;align-items:center;padding-right:2px}
.alert .pick input{width:18px;height:18px;accent-color:var(--neon);cursor:pointer}
.alert.picked{outline:2px solid var(--neon);outline-offset:-1px}
.paybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.paybar.active{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 8px 24px rgba(0,0,0,.4)}
.paybar .paysum{display:grid;gap:2px;min-width:0}
.paybar .note{flex-basis:100%;margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--neon);font:inherit;text-decoration:underline;cursor:pointer}
.badge{font:600 12px var(--f-mono);padding:4px 10px;border-radius:3px;text-transform:uppercase;letter-spacing:.08em}
.badge.good{background:rgba(74,222,128,.15);color:var(--good)} .badge.bad{background:rgba(255,107,107,.15);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="panel login" id="loading"><p class="status">Loading…</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js?v=pay1"></script>
</body>
</html>
